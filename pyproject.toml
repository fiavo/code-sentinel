[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-sentinel"
version = "1.0.0"
description = "AI-Powered Code Review Bot - Smart code analysis, security scanning, auto-fix, and Telegram bot integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mohammad", email = "mohammad@example.com"}
]
keywords = ["code-review", "ai", "linting", "security", "quality", "telegram-bot", "code-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
telegram = ["aiogram>=3.7.0"]
all = ["aiogram>=3.7.0"]

[project.scripts]
code-sentinel = "code_reviewer.cli:main"
sentinel-bot = "code_reviewer.telegram.__main__:main"

[project.urls]
Homepage = "https://github.com/fiavo/code-sentinel"
Documentation = "https://github.com/fiavo/code-sentinel#readme"
Repository = "https://github.com/fiavo/code-sentinel"
Issues = "https://github.com/fiavo/code-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]
